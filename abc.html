<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image and Iframe Demo</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; line-height: 1.5; }
    h1 { color: #334; }
    img, iframe {
      display: block;
      margin: 1rem 0;
      border: 2px solid #4444aa;
      border-radius: 6px;
    }
    img { width: 400px; height: auto; }
    iframe { width: 100%; height: 400px; }
  </style>
</head>
<body>
  <h1>Image and Iframe Example</h1>

  <h2>1. Image (&lt;img&gt;)</h2>
  <img
    src="http://example.com/latest/meta-data"
    alt="A random sample photo"
  />

  <h2>2. Embedded page (&lt;iframe&gt;)</h2>
  <iframe
    src="http://example.com/latest/meta-data"
    title="Embedded example website"
  ></iframe>
</body>
</html>
